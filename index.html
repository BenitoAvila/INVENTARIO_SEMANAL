<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurofert · Acceso</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- jsSHA para hash -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/3.3.0/sha.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: rotate 30s linear infinite;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 50px;
            color: #00c853;
            background: rgba(0, 200, 83, 0.2);
            padding: 20px;
            border-radius: 30px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .logo h2 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-top: 5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 16px;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #00c853;
            background: rgba(0, 0, 0, 0.35);
        }

        .input-wrapper input:focus + i.input-icon {
            color: #00c853;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s;
            z-index: 2;
        }

        .toggle-password:hover {
            color: #00c853;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00c853, #009624);
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 25px 0 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px -5px rgba(0, 200, 83, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(0, 200, 83, 0.6);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login.loading {
            color: transparent;
            pointer-events: none;
        }

        .btn-login.loading::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            top: 50%;
            left: 50%;
            margin: -12px 0 0 -12px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 14px 18px;
            border-radius: 16px;
            margin: 20px 0 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: shake 0.5s;
        }

        .alert i {
            font-size: 20px;
        }

        .alert.error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ffb3b3;
        }

        .alert.success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid rgba(40, 167, 69, 0.4);
            color: #b5e6b5;
        }

        .alert.warning {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid rgba(255, 193, 7, 0.4);
            color: #ffe083;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%,60% { transform: translateX(-5px); }
            40%,80% { transform: translateX(5px); }
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
        }

        .version {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="logo">
                <i class="fas fa-cube"></i>
                <h2>EUROFERT</h2>
                <p>Panel de Control</p>
            </div>

            <div class="input-group">
                <label>Usuario</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="usuario" placeholder="ej: juan.perez" autocomplete="off">
                </div>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <div class="input-wrapper password-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="••••••••">
                    <span class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <button class="btn-login" id="btnLogin">
                <i class="fas fa-arrow-right-to-bracket" style="margin-right: 8px;"></i> Ingresar
            </button>

            <div id="mensaje"></div>

            <div class="footer">
                © 2026 · Control de Inventarios
            </div>
        </div>
    </div>

    <div class="version">v3.0</div>

    <script>
        // ============================================
        // CONFIGURACIÓN FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBeg5PzCkaf98mmWiXrr6wpu8v-iWDj0t4",
            authDomain: "inventario-eurofert.firebaseapp.com",
            databaseURL: "https://inventario-eurofert-default-rtdb.firebaseio.com",
            projectId: "inventario-eurofert",
            storageBucket: "inventario-eurofert.firebasestorage.app",
            messagingSenderId: "786796692081",
            appId: "1:786796692081:web:c742cfbd1d23c3347f91d0"
        };

        // Limpiar sesión anterior
        localStorage.clear();

        let db = null;
        let firebaseReady = false;

        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            firebaseReady = true;
            console.log("✅ Firebase listo");
        } catch (error) {
            console.error("❌ Error Firebase:", error);
        }

        // ============================================
        // ELEMENTOS DEL DOM
        // ============================================
        const usuarioInput = document.getElementById('usuario');
        const passwordInput = document.getElementById('password');
        const btnLogin = document.getElementById('btnLogin');
        const mensajeDiv = document.getElementById('mensaje');
        const togglePassword = document.getElementById('togglePassword');

        let isLoading = false;

        // ============================================
        // FUNCIÓN HASH
        // ============================================
        function hashPassword(password) {
            const shaObj = new jsSHA("SHA-256", "TEXT");
            shaObj.update(password);
            return shaObj.getHash("HEX");
        }

        // ============================================
        // MOSTRAR MENSAJE
        // ============================================
        function mostrarMensaje(texto, tipo) {
            mensajeDiv.className = `alert ${tipo}`;
            const icono = tipo === 'success' ? 'fa-circle-check' : 
                          tipo === 'error' ? 'fa-circle-exclamation' : 'fa-triangle-exclamation';
            mensajeDiv.innerHTML = `<i class="fas ${icono}"></i> ${texto}`;
            setTimeout(() => {
                mensajeDiv.innerHTML = '';
                mensajeDiv.className = '';
            }, 5000);
        }

        // ============================================
        // TOGGLE PASSWORD (corregido con event listener)
        // ============================================
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        // ============================================
        // LOGIN
        // ============================================
        async function login() {
            if (isLoading) return;

            const usuario = usuarioInput.value.trim();
            const password = passwordInput.value.trim();

            if (!usuario || !password) {
                mostrarMensaje('Completa todos los campos', 'error');
                return;
            }

            if (!firebaseReady || !db) {
                mostrarMensaje('Firebase no disponible. Recarga.', 'error');
                return;
            }

            isLoading = true;
            btnLogin.classList.add('loading');
            btnLogin.innerHTML = ''; // El spinner se ve vía CSS

            try {
                const snapshot = await db.ref('usuarios/' + usuario).once('value');

                if (!snapshot.exists()) {
                    mostrarMensaje('Usuario o contraseña incorrectos', 'error');
                    resetearBoton();
                    return;
                }

                const data = snapshot.val();

                // Bloqueo por intentos
                if (data.bloqueadoHasta) {
                    const bloqueo = new Date(data.bloqueadoHasta);
                    if (bloqueo > new Date()) {
                        const minutos = Math.ceil((bloqueo - new Date()) / 60000);
                        mostrarMensaje(`Cuenta bloqueada. Intenta en ${minutos} min`, 'error');
                        resetearBoton();
                        return;
                    }
                }

                // Verificar contraseña (con migración automática si es texto plano)
                const storedPass = data.password;
                const esHash = storedPass && storedPass.length === 64 && /^[a-f0-9]+$/.test(storedPass);
                let passwordValida = false;
                let necesitaMigracion = false;

                if (esHash) {
                    passwordValida = (storedPass === hashPassword(password));
                } else {
                    passwordValida = (storedPass === password);
                    if (passwordValida) necesitaMigracion = true;
                }

                if (!passwordValida) {
                    // Incrementar intentos fallidos
                    const intentos = (data.intentosFallidos || 0) + 1;
                    const updates = {};
                    updates[`/usuarios/${usuario}/intentosFallidos`] = intentos;

                    if (intentos >= 3) {
                        const bloqueoHasta = new Date(Date.now() + 5 * 60000).toISOString();
                        updates[`/usuarios/${usuario}/bloqueadoHasta`] = bloqueoHasta;
                        updates[`/usuarios/${usuario}/intentosFallidos`] = 0;
                        await db.ref().update(updates);
                        mostrarMensaje('Demasiados intentos. Bloqueado 5 min', 'error');
                    } else {
                        await db.ref().update(updates);
                        mostrarMensaje('Usuario o contraseña incorrectos', 'error');
                    }
                    resetearBoton();
                    return;
                }

                // Migrar a hash si era texto plano
                if (necesitaMigracion) {
                    await db.ref(`usuarios/${usuario}`).update({
                        password: hashPassword(password)
                    });
                }

                // Resetear intentos fallidos y guardar sesión
                await db.ref(`usuarios/${usuario}`).update({
                    intentosFallidos: 0,
                    bloqueadoHasta: null,
                    ultimoAcceso: new Date().toISOString()
                });

                localStorage.setItem('usuario', usuario);
                localStorage.setItem('rol', data.rol);
                localStorage.setItem('ultimoUsuario', usuario);

                mostrarMensaje('Acceso correcto. Redirigiendo...', 'success');

                setTimeout(() => {
                    if (data.rol === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'panel.html';
                    }
                }, 1000);

            } catch (error) {
                console.error('Error en login:', error);
                mostrarMensaje('Error de conexión. Intenta de nuevo.', 'error');
                resetearBoton();
            }
        }

        function resetearBoton() {
            isLoading = false;
            btnLogin.classList.remove('loading');
            btnLogin.innerHTML = '<i class="fas fa-arrow-right-to-bracket" style="margin-right: 8px;"></i> Ingresar';
        }

        // Eventos Enter
        usuarioInput.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
        passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
        btnLogin.addEventListener('click', login);

        // Precargar último usuario
        window.addEventListener('load', () => {
            const ultimo = localStorage.getItem('ultimoUsuario');
            if (ultimo) {
                usuarioInput.value = ultimo;
                passwordInput.focus();
            } else {
                usuarioInput.focus();
            }
        });
    </script>
</body>
</html>
